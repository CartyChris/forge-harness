.crit{border-left:2px solid var(--violet);padding:2px 0 2px 10px;color:var(--text-2);font-size:13px}.crit b{color:var(--violet);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.errbox{border:1px solid rgba(248,81,73,.45);background:rgba(248,81,73,.08);color:var(--danger);border-radius:10px;padding:8px 12px;font-size:13px}
.mactions{display:flex;gap:2px;flex-wrap:wrap}.mactions button{height:30px;padding:0 8px;border-radius:8px;color:var(--muted);font-size:12px;display:inline-flex;align-items:center;gap:5px}.mactions button:hover{background:var(--card);color:var(--text)}
.mmeta{font:10.5px var(--mono);color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}.mchip{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:99px;border:1px solid var(--line);background:var(--bg-2);color:var(--text-2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.typing{display:inline-flex;gap:4px;padding:4px 0}.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:pulse 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
/* empty state */
.empty{max-width:640px;margin:6vh auto 0;text-align:center;padding:0 8px}.empty h1{font-size:22px;margin:10px 0 4px}.empty p{margin:0 0 16px;color:var(--muted)}
.sugg{display:grid;grid-template-columns:1fr;gap:8px;text-align:left}@media (min-width:640px){.sugg{grid-template-columns:1fr 1fr}}
.sg{display:flex;gap:10px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg-2);min-height:54px;text-align:left}.sg:hover{border-color:var(--accent-line);background:var(--card)}.sg .em{font-size:20px}.sg b{display:block;font-size:13.5px}.sg span.s{font-size:12px;color:var(--muted)}
/* composer */
#composer{position:relative;z-index:5;flex:none;padding:6px 10px 8px;padding-bottom:calc(8px + max(var(--sab), var(--kb)));background:linear-gradient(transparent,var(--bg) 18%)}
.cmp{max-width:820px;margin:0 auto;position:relative}
.cmp-box{background:var(--card);border:1px solid var(--line-2);border-radius:18px;padding:8px 8px 6px;transition:border-color .15s}.cmp-box:focus-within{border-color:var(--accent-line)}
.cmp textarea{width:100%;border:0;background:transparent;resize:none;outline:0;padding:6px 8px;max-height:200px;min-height:26px;font-size:15px;line-height:1.45}
.cmp-bar{display:flex;align-items:center;gap:6px;padding-top:2px}.cmp-bar .sp{flex:1}
.cmp-btn{height:40px;min-width:40px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-2);padding:0 8px;gap:5px;font-size:12px}.cmp-btn:hover{background:var(--card-2)}
.cmp-send{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#06101e;display:inline-flex;align-items:center;justify-content:center}.cmp-send[disabled]{background:var(--line-2);color:var(--muted)}.cmp-send.stop{background:var(--danger);color:#fff}
.pill{height:28px;padding:0 10px;border-radius:99px;border:1px solid var(--line-2);color:var(--muted);font-size:12px;display:inline-flex;align-items:center;gap:5px}.pill.on{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.ctxbar{display:flex;gap:6px;flex-wrap:wrap;padding:0 4px 6px}.ctxchip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 4px 0 9px;border-radius:99px;background:var(--accent-soft);border:1px solid var(--accent-line);font:11.5px var(--mono);color:var(--accent)}.ctxchip button{width:18px;height:18px;border-radius:50%;color:inherit}
.ac{position:absolute;bottom:calc(100% + 8px);left:0;right:0;max-height:260px;overflow-y:auto;background:var(--card-2);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow-lg);padding:4px;z-index:30;display:none}.ac.on{display:block}
.ac-i{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:10px;cursor:pointer;min-height:40px}.ac-i.sel,.ac-i:hover{background:var(--accent-soft)}.ac-i b{font:600 13px var(--mono);color:var(--accent)}.ac-i span{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* views: lists, plugins, settings */
.seg{display:inline-flex;background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}.seg button{height:30px;padding:0 12px;border-radius:7px;font-size:12.5px;color:var(--text-2)}.seg button.on{background:var(--card-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2)}
.li{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg-2);margin-bottom:8px}.li .info{flex:1;min-width:0}.li .nm{font-weight:600;font-size:13.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.li .ds{font-size:12px;color:var(--muted);margin-top:2px}
.pt-chip{font:10.5px var(--mono);padding:1px 7px;border-radius:99px;background:var(--card-2);color:var(--muted);border:1px solid var(--line)}
.sec-t{margin:18px 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}.sec-t:first-child{margin-top:0}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:13px;align-items:center}.kv>label{color:var(--muted);font-size:12px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.field>label{font-size:12px;color:var(--muted)}.field .hint{font-size:11.5px;color:var(--muted)}
.trow{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid var(--line);font:11.5px/1.45 var(--mono)}.trow .ts{color:var(--muted);flex:none}.trow .lv{flex:none;width:44px}.trow .lv.error{color:var(--danger)}.trow .lv.warn{color:var(--warn)}.trow .lv.info{color:var(--accent)}.trow .src{color:var(--violet);flex:none;max-width:110px;overflow:hidden;text-overflow:ellipsis}.trow .ms{flex:1;min-width:0;word-break:break-word}
.tier-g{display:grid;gap:8px}.tier{border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;background:var(--bg-2)}.tier.on{border-color:var(--accent-line);background:var(--accent-soft)}.tier b{display:block;font-size:13.5px}.tier span{font-size:12px;color:var(--muted)}
.scanw{border:1px solid rgba(210,153,34,.45);background:rgba(210,153,34,.07);border-radius:10px;padding:8px 12px;font-size:12.5px;margin:8px 0}.scanw.high{border-color:rgba(248,81,73,.5);background:rgba(248,81,73,.07)}
.appr-top{display:flex;gap:8px;align-items:center;margin-bottom:8px}.appr-path{font-size:12px;margin-bottom:6px;color:var(--text-2);word-break:break-all}.appr-pre{margin:6px 0;padding:10px;background:var(--code-bg);border:1px solid var(--line);border-radius:10px;font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;max-height:240px;overflow:auto}.appr-note{font-size:12.5px;color:var(--muted);margin-top:10px}
.empty-v{text-align:center;color:var(--muted);padding:40px 10px}
@media (pointer:coarse){input,textarea,select,.inp,.sel,textarea.inp,.cmp textarea{font-size:16px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
button:focus-visible,[tabindex]:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.boot{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:999;flex-direction:column;gap:12px;color:var(--muted)}

/* ── chat never scrolls sideways: everything wraps or scrolls inside its own box ── */
#msgs{overflow-x:hidden;overflow-x:clip}
.msgs-in,.turn,.turn>*,.turn .bubble,.turn .md,.tcall,.tc-b,.errbox,.reason,.foot{min-width:0;max-width:100%}
.turn{width:100%}.turn.user{max-width:min(88%,100%)}
.turn .bubble,.turn .md,.errbox,.reason,.tcall .tc-h,.tcall .tc-b,.mchip,.askc{overflow-wrap:anywhere;word-break:break-word}
.errbox,.tc-b{white-space:pre-wrap}
.md pre{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.md pre code{overflow-wrap:normal;word-break:normal;white-space:pre}
.md :not(pre)>code{overflow-wrap:anywhere;word-break:break-all;white-space:pre-wrap}
.md table{display:block;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.md img,.md video,.md iframe,.md svg{max-width:100%;height:auto}
.foot{flex-wrap:wrap}
